# NB Translators: can be used in comment line just *before* translation
  
[python: **.py]
method = python
encoding = utf-8
add_comments = TRANSLATORS:
keywords = _translate

[javascript: **.svelte]
method = javascript
encoding = utf-8
add_comments = TRANSLATORS:
keywords = translate

[javascript: **.js]
method = javascript
encoding = utf-8
add_comments = TRANSLATORS:
keywords = translate
